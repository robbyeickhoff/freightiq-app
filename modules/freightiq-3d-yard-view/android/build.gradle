plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.freightiq3dyardview'
version = '1.0.0'

android {
  namespace 'expo.modules.freightiq3dyardview'
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation('com.google.android.gms:play-services-maps3d:16.0.1') {
    // Maps 3D 16.0.1 publishes Kotlin 2.3 as a transitive runtime dependency.
    // Expo SDK 57 compiles with Kotlin 2.1.20, so retain Expo's runtime version;
    // the Maps 3D API itself is consumed with the scoped metadata check below.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
  }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  compilerOptions {
    freeCompilerArgs.add('-Xskip-metadata-version-check')
  }
}
